[build]
  publish = "public"
  # Converts data/sales.csv into a module the functions import. Reading it at
  # build time keeps the file out of public/, where it would be served to
  # anyone with the URL and bypass the report's password gate.
  command = "node scripts/build-sales.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The report page is private data. Keep it out of search engines and
# out of other people's frames.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
