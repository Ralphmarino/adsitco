[build]
  publish = "public"
  # Converts the files in data/ (the sales workbook, the curated blog list) into
  # modules the functions import. Reading them at build time keeps them out of
  # public/, where they would be served to anyone with the URL and bypass the
  # report's password gate.
  command = "node scripts/build-sales.mjs && node scripts/build-blog-tracker.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The report page is private data. Keep it out of search engines and
# out of other people's frames.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
